<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Roboto Origin Runtime architecture</title>
  <desc id="d">The debug laptop talks to the robot computer over Wi-Fi (ROS 2 and SSH). The robot computer runs the control container and connects over USB to the power hub, which is fed by the 48 V battery and drives four CAN buses: left leg, right leg and waist, left arm, right arm.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #ffffff; }
      .h { font-size: 16px; font-weight: 700; }
      .s { font-size: 13px; fill: #b9c4e6; }
      .m { font-size: 12.5px; font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; fill: #dbe2f5; }
      .lab { font-size: 12.5px; fill: #c9d2ea; }
      .box { fill: #16307a; stroke: #3a55a6; stroke-width: 1.5; }
      .inner { fill: #0f2659; stroke: #e0115f; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .wire { fill: none; stroke: #8fa3dc; stroke-width: 2; }
      .flow { stroke-dasharray: 7 7; animation: flow 1.1s linear infinite; }
      .flowr { stroke-dasharray: 7 7; animation: flow 1.1s linear infinite reverse; }
      .power { fill: none; stroke: #ffb3cb; stroke-width: 3; stroke-dasharray: 10 6; animation: flow 0.8s linear infinite reverse; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: 700px 190px; }
      .led { animation: blink 1.6s steps(2, start) infinite; }
      @keyframes flow { to { stroke-dashoffset: -28; } }
      @keyframes pulse { 0%, 100% { opacity: 0.15; transform: scale(1); } 50% { opacity: 0.55; transform: scale(1.06); } }
      @keyframes blink { to { visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) {
        .flow, .flowr, .power, .pulse, .led { animation: none; }
        .pkt { display: none; }
      }
    </style>
    <path id="p-cmd" d="M540 175 H610"/>
    <path id="p-log" d="M290 240 H220"/>
    <path id="p-ros" d="M220 185 H290"/>
    <path id="p-c0" d="M790 190 C815 190 815 98 840 98"/>
    <path id="p-c1" d="M790 190 C815 190 815 164 840 164"/>
    <path id="p-c2" d="M790 190 C815 190 815 230 840 230"/>
    <path id="p-c3" d="M790 190 C815 190 815 296 840 296"/>
  </defs>

  <rect width="1000" height="430" rx="14" fill="#0b1f4b"/>

  <!-- wires -->
  <path class="wire flow" d="M220 185 H290"/>
  <path class="wire flowr" d="M220 240 H290"/>
  <text class="lab" x="255" y="176" text-anchor="middle">ROS 2</text>
  <text class="lab" x="255" y="231" text-anchor="middle">SSH</text>
  <text class="lab" x="255" y="152" text-anchor="middle">Wi-Fi</text>
  <path class="wire flow" d="M540 175 H610"/>
  <path class="wire" d="M540 215 H610"/>
  <text class="lab" x="575" y="166" text-anchor="middle">USB</text>
  <text class="lab" x="575" y="206" text-anchor="middle">5 V</text>
  <path class="wire" d="M790 190 C815 190 815 98 840 98"/>
  <path class="wire" d="M790 190 C815 190 815 164 840 164"/>
  <path class="wire" d="M790 190 C815 190 815 230 840 230"/>
  <path class="wire" d="M790 190 C815 190 815 296 840 296"/>
  <path class="power" d="M700 250 V318"/>
  <text class="lab" x="712" y="290">48 V</text>

  <!-- laptop -->
  <rect class="box" x="30" y="140" width="190" height="150" rx="10"/>
  <text class="h" x="46" y="168">Laptop</text>
  <text class="s" x="46" y="188">debug station</text>
  <text class="m" x="46" y="216">ros2 topic · bag</text>
  <text class="m" x="46" y="238">stream_logs.sh</text>
  <text class="m" x="46" y="260">dmesg · 5 V log</text>

  <!-- robot computer -->
  <rect class="box" x="290" y="90" width="250" height="240" rx="10"/>
  <circle class="led" cx="522" cy="108" r="5" fill="#4ade80"/>
  <text class="h" x="306" y="118">Robot computer</text>
  <text class="s" x="306" y="138">Pi 5 · RDK X5 · Linux PC</text>
  <rect class="inner" x="304" y="152" width="222" height="104" rx="7"/>
  <text class="s" x="316" y="174" style="fill:#ff8fb3">Docker container</text>
  <text class="m" x="316" y="196">roboparty_deploy</text>
  <text class="m" x="316" y="216">ONNX policy · ROS 2</text>
  <text class="m" x="316" y="236">candump can0–can3</text>
  <text class="s" x="306" y="282">Host: SocketCAN · udev</text>
  <text class="s" x="306" y="302">RT limits · gs_usb</text>

  <!-- power hub -->
  <rect class="pulse" x="604" y="124" width="192" height="132" rx="14" fill="#e0115f"/>
  <rect x="610" y="130" width="180" height="120" rx="10" fill="#e0115f" stroke="#ff5c93" stroke-width="1.5"/>
  <text class="h" x="626" y="158">Power hub V2.x</text>
  <text class="s" x="626" y="182" style="fill:#ffe0eb">4 × STM32 USB→CAN</text>
  <text class="s" x="626" y="202" style="fill:#ffe0eb">isolated transceivers</text>
  <text class="s" x="626" y="222" style="fill:#ffe0eb">48 V → 5 V buck</text>

  <!-- battery -->
  <rect class="box" x="610" y="318" width="180" height="56" rx="10"/>
  <rect x="770" y="336" width="6" height="20" rx="2" fill="#3a55a6"/>
  <text class="h" x="626" y="342">Battery</text>
  <text class="s" x="626" y="362">48 V · 15 Ah</text>

  <!-- limbs -->
  <g>
    <rect class="box" x="840" y="70" width="140" height="56" rx="8"/>
    <text class="h" x="854" y="94">can0</text><text class="s" x="854" y="114">Left leg</text>
    <rect class="box" x="840" y="136" width="140" height="56" rx="8"/>
    <text class="h" x="854" y="160">can1</text><text class="s" x="854" y="180">Right leg + waist</text>
    <rect class="box" x="840" y="202" width="140" height="56" rx="8"/>
    <text class="h" x="854" y="226">can2</text><text class="s" x="854" y="246">Left arm</text>
    <rect class="box" x="840" y="268" width="140" height="56" rx="8"/>
    <text class="h" x="854" y="292">can3</text><text class="s" x="854" y="312">Right arm</text>
  </g>

  <!-- moving packets -->
  <g class="pkt">
    <circle r="5" fill="#ff5c93"><animateMotion dur="1.2s" repeatCount="indefinite"><mpath href="#p-cmd"/></animateMotion></circle>
    <circle r="4.5" fill="#ffffff"><animateMotion dur="1.6s" repeatCount="indefinite"><mpath href="#p-ros"/></animateMotion></circle>
    <circle r="4.5" fill="#7dd3fc"><animateMotion dur="1.6s" begin="-0.8s" repeatCount="indefinite"><mpath href="#p-log"/></animateMotion></circle>
    <circle r="4.5" fill="#ff5c93"><animateMotion dur="1s" begin="0s" repeatCount="indefinite"><mpath href="#p-c0"/></animateMotion></circle>
    <circle r="4.5" fill="#ff5c93"><animateMotion dur="1s" begin="-0.25s" repeatCount="indefinite"><mpath href="#p-c1"/></animateMotion></circle>
    <circle r="4.5" fill="#ff5c93"><animateMotion dur="1s" begin="-0.5s" repeatCount="indefinite"><mpath href="#p-c2"/></animateMotion></circle>
    <circle r="4.5" fill="#ff5c93"><animateMotion dur="1s" begin="-0.75s" repeatCount="indefinite"><mpath href="#p-c3"/></animateMotion></circle>
  </g>

  <text class="s" x="30" y="404">The laptop observes and records. Only the robot computer drives the motors over 4 CAN buses at 1 Mbit/s.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
