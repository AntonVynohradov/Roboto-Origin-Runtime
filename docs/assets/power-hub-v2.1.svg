<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><title id="t">RBE PWR HUB V2.1 block diagram</title><desc id="d">Battery 48 V feeds 48VIN; an external motor button switches 48 V to four XT30 connectors. An LM5148 buck makes 5 V for the computer through a computer button and a power-only USB-C. The computer's USB port powers the USB hub, four STM32 USB-to-CAN bridges and four isolated ISO1050 transceivers that drive CAN1 to CAN4.</desc><defs>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #ffffff; }
    .h { font-size: 15px; font-weight: 700; }
    .s { font-size: 13px; fill: #b9c4e6; }
    .hs { font-size: 13px; fill: #ffe0eb; }
    .band { font-size: 14px; font-weight: 700; fill: #8fa3dc; }
    .box { fill: #16307a; stroke: #3a55a6; stroke-width: 1.5; }
    .hot { fill: #e0115f; stroke: #ff5c93; stroke-width: 1.5; }
    .ctr { fill: #0f2659; stroke: #e0115f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .wire { fill: none; stroke: #8fa3dc; stroke-width: 2; }
    .pw { fill: none; stroke: #ffb3cb; stroke-width: 3; stroke-dasharray: 10 6; animation: flow .9s linear infinite reverse; }
    .dt { fill: none; stroke: #8fa3dc; stroke-width: 2; stroke-dasharray: 7 7; animation: flow 1.1s linear infinite reverse; }
    .badge { fill: #e0115f; stroke: #ffffff; stroke-width: 2; }
    .bn { font-size: 13px; font-weight: 700; text-anchor: middle; }
    @keyframes flow { to { stroke-dashoffset: -32; } }
    @media (prefers-reduced-motion: reduce) { .pw, .dt { animation: none; } }
  </style>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#8fa3dc"/>
  </marker>
  <marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#ffb3cb"/>
  </marker></defs><rect width="1100" height="640" rx="14" fill="#0b1f4b"/><rect x="12" y="16" width="1076" height="134" rx="10" fill="#0f2659"/><text class="band" x="28" y="40">48 V power path</text><rect x="12" y="162" width="1076" height="134" rx="10" fill="#0f2659"/><text class="band" x="28" y="186">5 V for the computer</text><rect x="12" y="308" width="1076" height="252" rx="10" fill="#0f2659"/><text class="band" x="28" y="332">USB → 4 × CAN  ·  powered from the computer's USB port</text><path class="pw" d="M150 97 H176" marker-end="url(#arrp)"/><path class="pw" d="M400 97 H426" marker-end="url(#arrp)"/><path class="pw" d="M610 97 H636" marker-end="url(#arrp)"/><path class="pw" d="M860 97 H896" marker-end="url(#arrp)"/><rect class="box" x="20" y="62" width="130" height="70" rx="9"/><text class="h" x="34" y="87">Battery</text><text class="s" x="34" y="107">48 V · 15 Ah</text><rect class="box" x="180" y="62" width="220" height="70" rx="9"/><text class="h" x="194" y="87">48VIN</text><text class="s" x="194" y="107">TVS SMBJ60CA · ≈200 µF</text><rect class="hot" x="430" y="62" width="180" height="70" rx="9"/><text class="h" x="444" y="87">Motor button</text><text class="hs" x="444" y="107">external · U14/U15</text><rect class="box" x="640" y="62" width="220" height="70" rx="9"/><text class="h" x="654" y="87">4 × XT30 (2+2)</text><text class="s" x="654" y="107">48V · GND · CAN_H · CAN_L</text><rect class="box" x="900" y="62" width="180" height="70" rx="9"/><text class="h" x="914" y="87">Motors</text><text class="s" x="914" y="107">23 × Damiao DM</text><circle class="badge" cx="604" cy="64" r="12"/><text class="bn" x="604" y="68.5">1</text><path class="pw" d="M290 132 V204" marker-end="url(#arrp)"/><path class="pw" d="M400 243 H426" marker-end="url(#arrp)"/><path class="pw" d="M610 243 H636" marker-end="url(#arrp)"/><path class="pw" d="M860 243 H896" marker-end="url(#arrp)"/><rect class="box" x="180" y="208" width="220" height="70" rx="9"/><text class="h" x="194" y="233">LM5148 buck</text><text class="s" x="194" y="253">48VIN → 5V_1, always on</text><rect class="box" x="430" y="208" width="180" height="70" rx="9"/><text class="h" x="444" y="233">Computer button</text><text class="s" x="444" y="253">external · U4/U7</text><rect class="box" x="640" y="208" width="220" height="70" rx="9"/><text class="h" x="654" y="233">USB-C power (USB1)</text><text class="s" x="654" y="253">CC 10 kΩ → 5 V / 3 A</text><circle class="badge" cx="854" cy="210" r="12"/><text class="bn" x="854" y="214.5">2</text><rect class="box" x="900" y="208" width="180" height="216" rx="9"/><text class="h" x="914" y="233">Raspberry Pi 5</text><text class="s" x="914" y="253">robot computer</text><text class="s" x="914" y="271"></text><text class="s" x="914" y="289"></text><text class="s" x="914" y="307"></text><text class="s" x="914" y="325"></text><text class="s" x="914" y="343">USB 3 host port</text><text class="s" x="914" y="274" style="fill:#ffb3cb">5 V in ◀</text><path class="dt" d="M896 389 H864" marker-end="url(#arr)"/><path class="wire" d="M640 389 H614" marker-end="url(#arr)"/><path class="wire" d="M430 389 H404" marker-end="url(#arr)"/><rect class="box" x="640" y="354" width="220" height="70" rx="9"/><text class="h" x="654" y="379">USB-C data (USB2)</text><text class="s" x="654" y="399">CC 5.1 kΩ · USB device</text><rect class="box" x="430" y="354" width="180" height="70" rx="9"/><text class="h" x="444" y="379">F1 1 A polyfuse</text><text class="s" x="444" y="399">VBUS → +5V</text><rect class="box" x="180" y="354" width="220" height="70" rx="9"/><text class="h" x="194" y="379">+5V consumers</text><text class="s" x="194" y="399">TLV75733 → 3.3 V</text><text class="s" x="194" y="417"></text><text class="s" x="194" y="417">2 × VPS8505 → ISO_5V</text><circle class="badge" cx="604" cy="356" r="12"/><text class="bn" x="604" y="360.5">3</text><path class="dt" d="M750 424 V466" marker-end="url(#arr)"/><path class="dt" d="M640 505 H614" marker-end="url(#arr)"/><path class="dt" d="M430 505 H404" marker-end="url(#arr)"/><path class="dt" d="M180 505 H154" marker-end="url(#arr)"/><rect class="box" x="640" y="470" width="220" height="70" rx="9"/><text class="h" x="654" y="495">SL2.1A hub</text><text class="s" x="654" y="515">USB 2.0, 4 ports</text><rect class="box" x="430" y="470" width="180" height="70" rx="9"/><text class="h" x="444" y="495">4 × STM32G431</text><text class="s" x="444" y="515">USB → FDCAN · SWD</text><rect class="box" x="180" y="470" width="220" height="70" rx="9"/><text class="h" x="194" y="495">4 × ISO1050</text><text class="s" x="194" y="515">isolated · 120 Ω option</text><rect class="hot" x="20" y="470" width="130" height="70" rx="9"/><text class="h" x="34" y="495">CAN1–CAN4</text><text class="hs" x="34" y="515">→ XT30 above</text><circle cx="36" cy="577.5" r="8.5" fill="#e0115f"/><text x="36" y="582" style="font-size:11px;font-weight:700" text-anchor="middle">1</text><text class="s" x="52" y="582" style="fill:#dbe2f5">No pre-charge: the button connects 48 V to all motor drivers at once (inrush, BMS trip, ringing).</text><circle cx="36" cy="597.5" r="8.5" fill="#e0115f"/><text x="36" y="602" style="font-size:11px;font-weight:700" text-anchor="middle">2</text><text class="s" x="52" y="602" style="fill:#dbe2f5">Only 3 A advertised, no USB-PD: Pi 5 limits all its USB ports to 600 mA by default.</text><circle cx="36" cy="617.5" r="8.5" fill="#e0115f"/><text x="36" y="622" style="font-size:11px;font-weight:700" text-anchor="middle">3</text><text class="s" x="52" y="622" style="fill:#dbe2f5">The whole CAN section is powered from the Pi's USB port. All grounds are shared with the motors.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
