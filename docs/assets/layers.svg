<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 432" width="960" height="432" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><title id="t">Roboto Origin Runtime layers</title><desc id="d">Three layers: the container with ROS 2 and roboparty_deploy, the host with SocketCAN, udev and real-time limits, and the replaceable hardware.</desc><defs>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #ffffff; }
    .h { font-size: 15px; font-weight: 700; }
    .s { font-size: 13px; fill: #b9c4e6; }
    .hs { font-size: 13px; fill: #ffe0eb; }
    .band { font-size: 14px; font-weight: 700; fill: #8fa3dc; }
    .box { fill: #16307a; stroke: #3a55a6; stroke-width: 1.5; }
    .hot { fill: #e0115f; stroke: #ff5c93; stroke-width: 1.5; }
    .ctr { fill: #0f2659; stroke: #e0115f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .wire { fill: none; stroke: #8fa3dc; stroke-width: 2; }
    .pw { fill: none; stroke: #ffb3cb; stroke-width: 3; stroke-dasharray: 10 6; animation: flow .9s linear infinite reverse; }
    .dt { fill: none; stroke: #8fa3dc; stroke-width: 2; stroke-dasharray: 7 7; animation: flow 1.1s linear infinite reverse; }
    .badge { fill: #e0115f; stroke: #ffffff; stroke-width: 2; }
    .bn { font-size: 13px; font-weight: 700; text-anchor: middle; }
    @keyframes flow { to { stroke-dashoffset: -32; } }
    @media (prefers-reduced-motion: reduce) { .pw, .dt { animation: none; } }
  </style>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#8fa3dc"/>
  </marker>
  <marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#ffb3cb"/>
  </marker></defs><rect width="960" height="432" rx="14" fill="#0b1f4b"/><rect class="ctr" x="24" y="24" width="912" height="102" rx="12"/><text class="h" x="44" y="58" style="font-size:18px">Container</text><text class="s" x="44" y="80">docker/Dockerfile</text><text class="s" x="44" y="98">same image everywhere</text><rect x="224" y="42" width="121" height="28" rx="14" fill="#3a0f26" stroke="#e0115f"/><text class="s" x="237" y="61" style="fill:#dbe2f5">ROS 2 Humble</text><rect x="354.5625" y="42" width="183" height="28" rx="14" fill="#3a0f26" stroke="#e0115f"/><text class="s" x="367.5625" y="61" style="fill:#dbe2f5">roboparty_deploy (built)</text><rect x="547.453125" y="42" width="107" height="28" rx="14" fill="#3a0f26" stroke="#e0115f"/><text class="s" x="560.453125" y="61" style="fill:#dbe2f5">ONNX policy</text><rect x="664.40625" y="42" width="81" height="28" rx="14" fill="#3a0f26" stroke="#e0115f"/><text class="s" x="677.40625" y="61" style="fill:#dbe2f5">can-utils</text><rect x="224" y="80" width="205" height="28" rx="14" fill="#3a0f26" stroke="#e0115f"/><text class="s" x="237" y="99" style="fill:#dbe2f5">entrypoint: hardware check</text><rect x="439.390625" y="80" width="105" height="28" rx="14" fill="#3a0f26" stroke="#e0115f"/><text class="s" x="452.390625" y="99" style="fill:#dbe2f5">logs/&lt;run&gt;/</text><rect x="554.3125" y="80" width="161" height="28" rx="14" fill="#3a0f26" stroke="#e0115f"/><text class="s" x="567.3125" y="99" style="fill:#dbe2f5">candump can0–can3</text><path class="wire" d="M120 130 V166" marker-end="url(#arr)" marker-start="url(#arr)"/><text class="s" x="140" y="153" style="fill:#c9d2ea">network_mode: host  ·  SYS_NICE + rtprio  ·  /dev bind-mount</text><rect class="box" x="24" y="170" width="912" height="102" rx="12"/><text class="h" x="44" y="204" style="font-size:18px">Host</text><text class="s" x="44" y="226">host/setup_host.sh</text><text class="s" x="44" y="244">once per computer</text><rect x="224" y="188" width="105" height=