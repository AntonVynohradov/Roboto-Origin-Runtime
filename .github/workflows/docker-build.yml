# Builds the multi-arch image (arm64 for Raspberry Pi / RDK / Orange Pi, amd64 for PCs)
# and pushes it to GitHub Container Registry: ghcr.io/<owner>/roboto-origin-runtime
name: docker-build

on:
  push:
    branches: [main]
    paths: [docker/**, .github/workflows/docker-build.yml]
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: roboparty_deploy branch / tag / commit
        default: main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lower-case image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/roboto-origin-runtime" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            DEPLOY_REF=${{ github.event.inputs.deploy_ref || 'main' }}
          tags: |
            ${{ env.IMAGE }}:humble
            ${{ env.IMAGE }}:humble-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
